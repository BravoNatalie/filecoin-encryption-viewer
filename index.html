<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob: data:; font-src data:; connect-src https://*.ipfs.dweb.link; object-src blob:; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encrypted share · Filecoin Onchain Cloud</title>
    <style>
      @font-face {
        font-family: "Funnel Sans";
        src: url("./assets/fonts/FunnelSans.woff2") format("woff2");
        font-weight: 300 800;
        font-display: swap;
      }

      @font-face {
        font-family: Aspekta;
        src: url("./assets/fonts/AspektaVF.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }

      /* Tokens copied from the filecoin-pay-explorer console (light, then dark). */
      :root {
        color-scheme: light dark;
        --radius: 0.65rem;
        --background: oklch(1 0 0);
        --foreground: oklch(0.141 0.005 285.823);
        --card: oklch(1 0 0);
        /* brand-800 from the Filecoin Foundation tokens: 5.2:1 with white text */
        --primary: oklch(0.53 0.1592 252.62);
        --primary-foreground: oklch(1 0 0);
        --brand-soft: oklch(0.95 0.035 219.18);
        --brand-ink: oklch(0.53 0.1592 252.62);
        --page: oklch(0.975 0.006 250);
        --muted: oklch(0.967 0.001 286.375);
        --muted-foreground: oklch(0.552 0.016 285.938);
        --border: oklch(0.92 0.004 286.32);
        --destructive: oklch(0.577 0.245 27.325);
        --ring: oklch(0.55 0 0);
        --link: oklch(0.5 0.17 240);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 8px 24px rgba(0, 0, 0, 0.06);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(0.141 0.005 285.823);
          --foreground: oklch(0.985 0 0);
          --card: oklch(0.21 0.006 285.885);
          --muted: oklch(0.274 0.006 286.033);
          --muted-foreground: oklch(0.705 0.015 286.067);
          --border: oklch(1 0 0 / 10%);
          --destructive: oklch(0.704 0.191 22.216);
          --ring: oklch(0.708 0 0);
          --brand-soft: oklch(0.3 0.05 245);
          --brand-ink: oklch(0.76 0.1503 232.56);
          --page: oklch(0.141 0.005 285.823);
          --link: oklch(0.65 0.2 240);
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        /* The hero's white glow reads as a bright blob on the dark card */
        #app .hero {
          opacity: 0.82;
          filter: saturate(0.85);
        }
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--page);
        color: var(--foreground);
        font-family: "Funnel Sans", system-ui, sans-serif;
        line-height: 1.5;
      }

      /* #app is the card; render.ts adds .wide for image/video previews. */
      #app {
        width: min(28rem, calc(100% - 2rem));
        margin: 0.875rem 0 1.5rem;
        padding: 1.75rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow);
      }

      #app.wide {
        width: min(75rem, calc(100% - 2rem));
      }

      h1,
      h2 {
        font-family: Aspekta, "Funnel Sans", system-ui, sans-serif;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }

      h1.big {
        font-size: 2rem;
        font-weight: 700;
      }

      p {
        margin: 0 0 1rem;
      }

      /* Static header above the card, on the page background */
      .site-brand {
        display: flex;
        gap: 0.625rem;
        align-items: center;
        justify-content: center;
        margin-top: 1rem;
        color: var(--foreground);
        font-family: Aspekta, "Funnel Sans", system-ui, sans-serif;
        font-size: 1.125rem;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .site-brand img {
        width: 2rem;
        height: auto;
      }

      #app .hero {
        display: block;
        width: min(100%, 18.75rem);
        height: auto;
        margin: 0 auto 1rem;
      }

      #app .hero.small {
        width: 9rem;
      }

      .center {
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 0.25rem;
        color: var(--muted-foreground);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .lede,
      .hint {
        color: var(--muted-foreground);
      }

      @media (min-width: 640px) {
        .site-brand {
          gap: 0.75rem;
          margin-top: 2rem;
          font-size: 1.375rem;
        }

        .site-brand img {
          width: 2.5rem;
        }

        .lede span {
          display: block;
        }

        #app {
          width: min(36rem, calc(100% - 2rem));
          margin-top: 1.5rem;
          padding: 2.25rem 2.5rem;
        }

        #app.wide {
          width: min(75rem, calc(100% - 2rem));
        }
      }

      .hint {
        display: flex;
        gap: 0.375rem;
        align-items: center;
        justify-content: center;
        margin: 1rem 0 0;
        font-size: 0.8125rem;
        text-align: center;
      }

      .hint svg {
        width: 0.875rem;
        height: 0.875rem;
        flex: none;
      }

      .features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
        margin: 1.5rem 0;
        padding: 0;
        list-style: none;
        text-align: center;
      }

      .features li {
        color: var(--muted-foreground);
        font-size: 0.75rem;
        line-height: 1.35;
      }

      .feature-icon {
        display: grid;
        width: 2.5rem;
        height: 2.5rem;
        margin: 0 auto 0.5rem;
        place-items: center;
        border-radius: 50%;
        background: var(--brand-soft);
        color: var(--brand-ink);
      }

      .feature-icon svg {
        width: 1.25rem;
        height: 1.25rem;
      }

      .password-form label {
        display: block;
        margin-bottom: 0.375rem;
        font-size: 0.875rem;
        font-weight: 600;
      }

      .password-input {
        position: relative;
      }

      .password-input input {
        width: 100%;
        height: 3rem;
        padding: 0 3rem 0 0.875rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--background);
        color: var(--foreground);
        font: inherit;
      }

      .password-input input::placeholder {
        color: var(--muted-foreground);
      }

      input:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      .btn-primary {
        width: 100%;
        min-height: 3rem;
        margin-top: 1rem;
        border: 0;
        border-radius: var(--radius);
        background: var(--primary);
        color: var(--primary-foreground);
        font-weight: 600;
      }

      .btn-primary:hover {
        filter: brightness(1.12);
      }

      .btn-primary:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .password-toggle {
        position: absolute;
        top: 0.375rem;
        right: 0.375rem;
        display: grid;
        width: 2.25rem;
        height: 2.25rem;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: calc(var(--radius) - 0.2rem);
        background: transparent;
        color: var(--muted-foreground);
      }

      .password-toggle:hover {
        background: var(--muted);
        color: var(--foreground);
      }

      .password-toggle svg {
        width: 1.25rem;
        height: 1.25rem;
      }

      .error {
        margin: 1rem 0 0;
        padding-left: 0.75rem;
        border-left: 3px solid var(--destructive);
        color: var(--destructive);
        font-size: 0.875rem;
        font-weight: 500;
      }

      .content-wrapper {
        width: 100%;
      }

      /* Folder tree: native details/summary, files are buttons */
      #archive-tree ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      #archive-tree ul ul {
        margin-left: 0.6rem;
        padding-left: 0.75rem;
        border-left: 1px solid var(--border);
      }

      #archive-tree summary,
      #archive-tree .tree-file {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        width: 100%;
        min-height: 2.25rem;
        padding: 0.25rem 0.5rem;
        border: 0;
        border-radius: calc(var(--radius) - 0.2rem);
        background: transparent;
        color: var(--foreground);
        text-align: left;
        cursor: pointer;
      }

      #archive-tree summary {
        font-weight: 600;
        list-style: none;
      }

      #archive-tree summary::-webkit-details-marker {
        display: none;
      }

      /* Chevron that points down when the folder is open */
      #archive-tree summary::after {
        content: "";
        order: 3;
        width: 0.45rem;
        height: 0.45rem;
        margin-left: auto;
        border-right: 2px solid var(--muted-foreground);
        border-bottom: 2px solid var(--muted-foreground);
        transform: rotate(-45deg);
        transition: transform 0.15s;
      }

      #archive-tree details[open] > summary::after {
        transform: rotate(45deg);
      }

      #archive-tree summary:hover,
      #archive-tree .tree-file:hover {
        background: var(--muted);
      }

      #archive-tree svg {
        width: 1.125rem;
        height: 1.125rem;
        flex: none;
        color: var(--muted-foreground);
      }

      #archive-tree .tree-file {
        color: var(--link);
      }

      #archive-tree .tree-file:hover .tree-name {
        text-decoration: underline;
      }

      #archive-tree .tree-file:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #archive-tree .tree-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #archive-tree .tree-size {
        flex: none;
        margin-left: auto;
        color: var(--muted-foreground);
        font-size: 0.8125rem;
        font-variant-numeric: tabular-nums;
      }

      @media (prefers-reduced-motion: reduce) {
        #archive-tree summary::after {
          transition: none;
        }
      }

      .back-btn {
        width: auto;
        min-height: 2rem;
        margin: 0 0 1rem -0.5rem;
        padding: 0.25rem 0.5rem;
        border: 0;
        border-radius: calc(var(--radius) - 0.2rem);
        background: transparent;
        color: var(--link);
        font-weight: 500;
      }

      .back-btn:hover {
        background: var(--muted);
      }

      .file-title {
        overflow-wrap: anywhere;
      }

      .lede-left {
        color: var(--muted-foreground);
      }

      a.btn-primary {
        display: grid;
        place-items: center;
        text-decoration: none;
      }

      /* Outlined download action under previews; same height and radius as the primary button */
      .btn-secondary {
        display: grid;
        min-height: 3rem;
        margin-top: 1rem;
        padding: 0 1.5rem;
        place-items: center;
        border: 1px solid var(--muted-foreground);
        border-radius: var(--radius);
        background: transparent;
        color: var(--foreground);
        font-weight: 600;
        text-decoration: none;
        width: fit-content;
      }

      .btn-secondary:hover {
        background: var(--muted);
      }

      .btn-secondary:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      .note {
        font-size: 0.875rem;
      }

      /* Folder tree header: eyebrow + summary on the left, compact zip action on the right */
      .tree-head {
        margin: 0 0 0.75rem;
        padding-bottom: 0.875rem;
        border-bottom: 1px solid var(--border);
      }

      .tree-head-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: space-between;
        align-items: center;
      }

      /* Page <h1> above the card on the tree screen, lined up with the card's left edge */
      #card-label {
        width: min(28rem, calc(100% - 2rem));
        margin-top: 1.375rem;
      }

      #card-label:empty {
        display: none;
      }

      #card-label + #app {
        margin-top: 0.75rem;
      }

      /* Tighter card while the folder tree is shown (class set with the label, see card-label.ts) */
      #app.tree-card {
        padding: 1rem 1.25rem 1.25rem;
      }

      .card-label {
        margin: 0;
        color: var(--muted-foreground);
        font-family: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      @media (min-width: 640px) {
        #card-label {
          width: min(36rem, calc(100% - 2rem));
        }

        .card-label {
          font-size: 0.875rem;
        }

        #card-label + #app {
          margin-top: 0.875rem;
        }

        #app.tree-card {
          padding: 1.25rem 2rem 2rem;
        }
      }

      .tree-summary {
        margin: 0;
        color: var(--muted-foreground);
        font-size: 0.9375rem;
      }

      .btn-compact {
        display: inline-flex;
        gap: 0.375rem;
        align-items: center;
        min-height: 2rem;
        padding: 0 0.625rem;
        border: 1px solid var(--muted-foreground);
        border-radius: var(--radius);
        background: transparent;
        color: var(--foreground);
        font-size: 0.8125rem;
        font-weight: 600;
      }

      .btn-compact svg {
        width: 0.875rem;
        height: 0.875rem;
        flex: none;
      }

      .btn-compact:hover {
        background: var(--muted);
      }

      .btn-compact:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .zip-status {
        margin: 0.5rem 0 0;
        color: var(--muted-foreground);
        font-size: 0.8125rem;
        text-align: right;
      }

      .zip-status:empty {
        margin: 0;
      }

      #html-preview {
        margin: 0.5rem 0 0;
      }

      /* Previews */
      .content-wrapper img {
        max-width: 100%;
        display: block;
        margin: 0 auto;
      }

      .content-wrapper video,
      .content-wrapper audio {
        display: block;
        width: 100%;
        max-height: 82vh;
        margin: 0 auto;
      }

      .content-wrapper pre {
        margin: 0;
        padding: 1rem;
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--muted);
        color: var(--foreground);
        font-size: 0.875rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .content-wrapper embed {
        width: 100%;
        min-height: 80vh;
        border: 0;
        background: #fff;
      }

      /* The sandboxed page can't size itself (no scripts), so the frame has a fixed height. */
      .content-wrapper iframe {
        display: block;
        width: 100%;
        height: max(24rem, 60vh);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: #fff;
      }

      .download-link {
        display: inline-block;
        margin-top: 1rem;
        color: var(--link);
        font-weight: 500;
      }

      #save-entry-name {
        overflow-wrap: anywhere;
        font-weight: 500;
      }

      @media (max-width: 639px) {
        .content-wrapper iframe {
          height: max(20rem, 65vh);
        }

        .btn-secondary {
          width: 100%;
        }
      }

      @media (max-width: 480px) {
        #app {
          padding: 1.25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-brand">
      <img src="./assets/foc-logo-icon.svg" alt="" />
      <span>Filecoin Onchain Cloud</span>
    </header>
    <div id="card-label"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
